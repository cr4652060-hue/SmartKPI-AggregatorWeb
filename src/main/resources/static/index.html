<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自助设备 KPI 汇总工具</title>
    <style>
        :root {
            --bg: #eef4f8;
            --card: #ffffff;
            --primary: #0b5cab;
            --primary-deep: #083b75;
            --accent: #2f7f74;
            --text: #17324d;
            --muted: #5d7187;
            --border: #d5e2ee;
            --danger-bg: #fff1f0;
            --danger-border: #f0b6b0;
            --danger-text: #a93b34;
            --success-bg: #eff9f6;
            --success-border: #b8e1d7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(11, 92, 171, 0.14), transparent 32%),
                linear-gradient(180deg, #f7fbfd 0%, var(--bg) 100%);
        }

        .page {
            width: min(920px, calc(100% - 32px));
            margin: 40px auto;
        }

        .hero {
            padding: 28px 30px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(8, 59, 117, 0.96), rgba(11, 92, 171, 0.92));
            color: #f6fbff;
            box-shadow: 0 20px 48px rgba(21, 54, 91, 0.18);
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 4vw, 38px);
            letter-spacing: 0.04em;
        }

        .hero p {
            margin: 0;
            max-width: 680px;
            color: rgba(246, 251, 255, 0.86);
            line-height: 1.7;
        }

        .card {
            margin-top: 22px;
            padding: 30px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid rgba(213, 226, 238, 0.9);
            box-shadow: 0 14px 32px rgba(33, 63, 100, 0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 15px;
            font-weight: 600;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fbfdff;
            color: var(--muted);
        }

        .hint {
            font-size: 13px;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            margin-top: 26px;
        }

        button,
        .download-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 999px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-deep));
            color: #fff;
            box-shadow: 0 10px 18px rgba(11, 92, 171, 0.22);
        }

        button:hover,
        .download-link:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.72;
            transform: none;
            box-shadow: none;
        }

        .download-link {
            background: rgba(47, 127, 116, 0.12);
            border: 1px solid rgba(47, 127, 116, 0.2);
            color: var(--accent);
        }

        .status,
        .result,
        .error {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 16px;
            line-height: 1.7;
        }

        .status {
            display: none;
            color: var(--primary-deep);
            background: rgba(11, 92, 171, 0.07);
            border: 1px solid rgba(11, 92, 171, 0.12);
        }

        .status.is-loading::before {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 10px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 1s ease-in-out infinite;
            vertical-align: middle;
        }

        .result {
            display: none;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        .error {
            display: none;
            color: var(--danger-text);
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
        }

        .result-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.35;
                transform: scale(0.85);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 720px) {
            .page {
                width: min(100%, calc(100% - 20px));
                margin: 18px auto 24px;
            }

            .hero,
            .card {
                padding: 22px 18px;
                border-radius: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <section class="hero">
        <h1>自助设备 KPI 汇总工具</h1>
        <p>上传 5 份 Excel 文件后，系统会在后台调用现有汇总规则生成开机率与资源预警率两个结果文件，适合银行内网场景直接使用。</p>
    </section>

    <section class="card">
        <form id="aggregate-form" enctype="multipart/form-data">
            <div class="grid">
                <div class="field">
                    <label for="bootDeviceFile">开机率设备表</label>
                    <input id="bootDeviceFile" name="bootDeviceFile" type="file" accept=".xlsx" required>
                </div>
                <div class="field">
                    <label for="bootOrgTemplateFile">开机率机构模板</label>
                    <input id="bootOrgTemplateFile" name="bootOrgTemplateFile" type="file" accept=".xlsx" required>
                </div>
                <div class="field">
                    <label for="resourceDeviceFile">资源预警率设备表</label>
                    <input id="resourceDeviceFile" name="resourceDeviceFile" type="file" accept=".xlsx" required>
                </div>
                <div class="field">
                    <label for="resourceOrgTemplateFile">资源预警率机构模板</label>
                    <input id="resourceOrgTemplateFile" name="resourceOrgTemplateFile" type="file" accept=".xlsx" required>
                </div>
                <div class="field full">
                    <label for="offsiteCatalogFile">离行设备目录</label>
                    <input id="offsiteCatalogFile" name="offsiteCatalogFile" type="file" accept=".xlsx" required>
                    <div class="hint">请按原有模板准备文件，避免修改关键表头名称。</div>
                </div>
            </div>

            <div class="actions">
                <button id="submit-button" type="submit">开始汇总</button>
                <span class="hint">单文件上限 50MB，请保持浏览器窗口开启直至处理完成。</span>
            </div>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="error" class="error" role="alert"></div>
        <div id="result" class="result">
            <div id="result-message"></div>
            <div class="result-links">
                <a id="boot-download" class="download-link" href="#" download>下载开机率（机构）-汇总.xlsx</a>
                <a id="resource-download" class="download-link" href="#" download>下载资源预警率（机构）-汇总.xlsx</a>
            </div>
        </div>
    </section>
</main>

<script>
    const form = document.getElementById("aggregate-form");
    const submitButton = document.getElementById("submit-button");
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");
    const resultMessage = document.getElementById("result-message");
    const bootDownload = document.getElementById("boot-download");
    const resourceDownload = document.getElementById("resource-download");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        resetFeedback();
        setLoading(true, "正在处理，请稍候");

        try {
            const formData = new FormData(form);
            const response = await fetch("/api/aggregate", {
                method: "POST",
                body: formData
            });

            const responseText = await response.text();
            let payload = null;
            try {
                payload = responseText ? JSON.parse(responseText) : null;
            } catch (error) {
                payload = null;
            }

            if (!response.ok || !payload || !payload.success) {
                throw new Error(
                    (payload && payload.message) ||
                    responseText ||
                    "处理失败，请稍后重试。"
                );
            }

            setLoading(false, "处理完成");
            resultMessage.textContent = `任务编号：${payload.taskId}`;
            bootDownload.href = payload.bootDownloadUrl;
            resourceDownload.href = payload.resourceDownloadUrl;
            resultBox.style.display = "block";
        } catch (error) {
            setLoading(false, "");
            errorBox.textContent = error.message || "处理失败，请稍后重试。";
            errorBox.style.display = "block";
        } finally {
            submitButton.disabled = false;
        }
    });

    function setLoading(loading, message) {
        submitButton.disabled = loading;
        statusBox.textContent = message;
        statusBox.classList.toggle("is-loading", loading);
        statusBox.style.display = message ? "block" : "none";
    }

    function resetFeedback() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
        resultBox.style.display = "none";
        resultMessage.textContent = "";
        bootDownload.href = "#";
        resourceDownload.href = "#";
    }
</script>
</body>
</html>
